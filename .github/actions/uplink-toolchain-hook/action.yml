# Company toolchain hook. Replace these steps with what preflight.sh on this
# branch needs on the runner. See toolchain-hook.md on this branch.
name: Uplink toolchain hook
description: >-
  Set up the build and test toolchain for Uplink preflight.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free
        job-summary: errors
